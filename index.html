<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Metadata herunder er PLADSHOLDERE for forsiden.
      scripts/prerender.mjs skriver den rigtige title, description, canonical,
      Open Graph og JSON-LD ind pr. rute, når sitet bygges. Rediger derfor
      indholdet i src/seo/pages.ts — ikke her.
    -->
    <title>DJ og eventlys i Aarhus | Eske Hagen Events</title>
    <meta
      name="description"
      content="DJ fra Aarhus med 22+ års erfaring. Musik, lys og special effekter til bryllup, firmafest og privatfest i hele Øst- og Midtjylland. Få et tilbud."
    />
    <meta name="author" content="Eske Hagen Sinding" />
    <link rel="canonical" href="https://eskehagenevents.dk/" />

    <!-- meta keywords er bevidst fjernet: Google og Bing ignorerer den, og
         den eneste virkning var at vise konkurrenter hvilke ord vi går efter. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080808" />

    <!-- ── Open Graph ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eskehagenevents.dk/" />
    <meta property="og:title" content="DJ og eventlys i Aarhus | Eske Hagen Events" />
    <meta
      property="og:description"
      content="DJ fra Aarhus med 22+ års erfaring. Musik, lys og special effekter til bryllup, firmafest og privatfest i hele Øst- og Midtjylland. Få et tilbud."
    />
    <meta property="og:image" content="https://eskehagenevents.dk/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DJ-pult med lysopsætning til fest — EH Events, Aarhus" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:site_name" content="EH Events" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DJ og eventlys i Aarhus | Eske Hagen Events" />
    <meta
      name="twitter:description"
      content="DJ fra Aarhus med 22+ års erfaring. Musik, lys og special effekter til bryllup, firmafest og privatfest i hele Øst- og Midtjylland."
    />
    <meta name="twitter:image" content="https://eskehagenevents.dk/images/og-image.jpg" />

    <!--
      Temaet sættes FØR siden males. Uden dette script ville et lyst
      styresystem se et mørkt glimt, fordi React først kan nå at rette
      attributten efter første paint.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eh-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#faf7f4' : '#080808');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--__EH_HEAD__-->
  </head>
  <body>
    <div id="root"><!--__EH_APP__--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
